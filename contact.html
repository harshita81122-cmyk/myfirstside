<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | JEC Kukas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Contact JEC Kukas</h1>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="courses.html">Courses</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </header>

  <main>
    <h2>Get in Touch</h2>
    <p>
      For admissions, courses, or general questions, contact the JEC Kukas
      college office using the official contact information.
    </p>

    <address>
      JEC Kukas<br>
      Kukas, Jaipur, Rajasthan, India
    </address>

    <h2>Send an Enquiry</h2>
    <form action="#" method="get">
      <p>
        <label for="name">Your name:</label><br>
        <input type="text" id="name" name="name" required>
      </p>
      <p>
        <label for="email">Email address:</label><br>
        <input type="email" id="email" name="email" required>
      </p>
      <p>
        <label for="message">Your message:</label><br>
        <textarea id="message" name="message" rows="5" cols="30" required></textarea>
      </p>
      <button type="submit">Submit Enquiry</button>
    </form>
  </main>

  <footer>
    <p>&copy; JEC Kukas</p>
  </footer>
</body>
</html>
